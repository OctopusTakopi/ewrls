[package]
name = "ewrls"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Exponentially-weighted recursive least squares (EW-RLS) online regression"
license = "MIT"
repository = "https://github.com/OctopusTakopi/ewrls"
documentation = "https://docs.rs/ewrls"
readme = "README.md"
keywords = ["rls", "online-learning", "regression", "adaptive-filter", "streaming"]
categories = ["algorithms", "mathematics", "science"]

[dependencies]
nalgebra = "0.35"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
serde = ["dep:serde", "nalgebra/serde-serialize"]

[dev-dependencies]
bincode = "1.3"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[[bench]]
name = "ewrls_benchmark"
harness = false

[package.metadata.docs.rs]
all-features = true
